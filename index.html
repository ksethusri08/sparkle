<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        :root {
            --primary: #2D1B4E;
            --accent: #FF006E;
            --accent-light: #00D9FF;
            --accent-warm: #FFB703;
            --bg: #0F0A1A;
            --text-primary: #F5F5F5;
            --text-secondary: #B0B0B0;
            --card-bg: #1a0f2e;
            --shadow: rgba(255, 0, 110, 0.2);
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            opacity: 0;
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            pointer-events: all;
            z-index: 10;
        }

        /* PAGE TRANSITIONS */
        .page-1 {
            background: linear-gradient(135deg, #0F0A1A 0%, #1a0f2e 100%);
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: scale(0.85);
        }

        .page-1.active {
            transform: scale(1);
        }

        .page-2 {
            background: linear-gradient(135deg, #1a0f2e 0%, #2a1a4e 100%);
            transition: opacity 1s ease, transform 1s ease;
            transform: rotateX(-90deg);
        }

        .page-2.active {
            transform: rotateX(0deg);
        }

        .page-3 {
            background: linear-gradient(135deg, #2a1a4e 0%, #0F0A1A 100%);
            transition: opacity 1.2s ease, transform 1.2s ease;
            transform: translateY(150px) rotateZ(45deg);
        }

        .page-3.active {
            transform: translateY(0) rotateZ(0deg);
        }

        /* FLOATING HEARTS */
        .hearts-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            display: none;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: float-heart 6s ease-in-out infinite;
            opacity: 0.4;
        }

        @keyframes float-heart {
            0% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-30px) translateX(20px) rotate(180deg) scale(0.9); }
            100% { transform: translateY(0) translateX(0) rotate(360deg) scale(1); }
        }

        /* CARDS */
        .card {
            background: rgba(26, 15, 46, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            max-width: 95%;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.3);
            border: 2px solid rgba(255, 0, 110, 0.2);
            position: relative;
            z-index: 5;
        }

        .heading {
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF006E 0%, #00D9FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .message-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 12px 0;
            min-height: 40px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .option-btn {
            padding: 10px 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid rgba(255, 0, 110, 0.4);
            background: rgba(255, 0, 110, 0.1);
            color: #FF006E;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .option-btn:active {
            background: linear-gradient(135deg, #FF006E 0%, #FF3B7F 100%);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.6);
        }

        /* PAGE 2 */
        .message-card {
            background: rgba(26, 15, 46, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 18px;
            max-width: 95%;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 217, 255, 0.3);
            border: 2px solid rgba(0, 217, 255, 0.2);
            position: relative;
            z-index: 5;
        }

        .msg-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #00D9FF;
            margin-bottom: 10px;
            min-height: 30px;
        }

        .msg-body {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 12px 0;
            min-height: 60px;
        }

        .heart-icon {
            font-size: 35px;
            margin: 8px 0;
            animation: beat 1s ease-in-out infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
        }

        /* PAGE 3 */
        .calendar-card {
            background: rgba(26, 15, 46, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 18px;
            max-width: 95%;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 183, 3, 0.3);
            border: 2px solid rgba(255, 183, 3, 0.2);
            position: relative;
            z-index: 5;
            max-height: 90vh;
            overflow-y: auto;
        }

        .calendar-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #FFB703;
            margin-bottom: 12px;
        }

        .date-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }

        .date-input {
            padding: 10px;
            font-size: 13px;
            border: 2px solid rgba(255, 183, 3, 0.4);
            background: rgba(255, 183, 3, 0.1);
            color: var(--text-primary);
            border-radius: 10px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            text-align: center;
        }

        .date-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 3px;
        }

        .submit-btn {
            margin-top: 12px;
            padding: 10px 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 12px;
            font-weight: 700;
            border: none;
            background: linear-gradient(135deg, #FFB703 0%, #FFC107 100%);
            color: #000;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:active {
            transform: scale(0.95);
        }

        .countdown-display {
            margin-top: 12px;
            display: none;
        }

        .countdown-display.show {
            display: block;
        }

        .countdown-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .countdown-box {
            background: rgba(255, 183, 3, 0.1);
            border: 2px solid rgba(255, 183, 3, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
            min-width: 70px;
        }

        .countdown-num {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFB703 0%, #FFC107 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .countdown-label {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .quote-section {
            margin-top: 12px;
            padding: 10px;
            border-top: 2px solid rgba(255, 183, 3, 0.2);
        }

        .funny-quote {
            font-size: 12px;
            color: #00D9FF;
            font-style: italic;
            margin-bottom: 8px;
            min-height: 30px;
        }

        .waiting-msg {
            font-size: 11px;
            color: #FF006E;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* MUSIC BUTTON - ALWAYS VISIBLE */
        .music-button {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
        }

        .music-btn-style {
            padding: 10px 14px;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FF006E 0%, #00D9FF 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
            transition: all 0.3s ease;
        }

        .music-btn-style:active {
            transform: scale(0.9);
        }

        @media (max-width: 480px) {
            .card, .message-card, .calendar-card {
                padding: 16px;
            }

            .heading {
                font-size: 28px;
                margin-bottom: 10px;
            }

            .message-text {
                font-size: 13px;
            }

            .option-btn {
                padding: 9px 10px;
                font-size: 11px;
            }

            .msg-title {
                font-size: 20px;
            }

            .msg-body {
                font-size: 12px;
                min-height: 50px;
            }

            .heart-icon {
                font-size: 30px;
            }

            .calendar-title {
                font-size: 20px;
            }

            .date-input {
                padding: 9px;
                font-size: 12px;
            }

            .countdown-num {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- BACKGROUND MUSIC -->
    <audio id="bg-music" loop>
        <source src="https://www.dropbox.com/scl/fi/9mlcszyjzwt5ndkow6bdn/GulabiSadi___-_-_____Official_-video___Sanju_Rathod___G-Spark___Prajakta___-marathi_Song-256k.mp3?rlkey=7zvxn32bkc8ohw7s2hfswliu9&st=cna60sjl&dl=1" type="audio/mpeg">
    </audio>

    <!-- MUSIC CONTROL - TOP LEFT, ALWAYS VISIBLE -->
    <div class="music-button">
        <button onclick="playMusic()" class="music-btn-style">🎵 PLAY</button>
    </div>

    <div class="container">
        <!-- PAGE 1 -->
        <div class="page page-1 active">
            <div class="card">
                <div class="heading">Hii My Love 💕</div>
                <div class="message-text" id="msg1"></div>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectOption('bava')">BAVA</button>
                    <button class="option-btn" onclick="selectOption('love')">LOVE</button>
                    <button class="option-btn" onclick="selectOption('more')">MORE</button>
                    <button class="option-btn" onclick="selectOption('nothing')">NO</button>
                </div>
            </div>
        </div>

        <!-- PAGE 2 -->
        <div class="page page-2">
            <div class="message-card">
                <div class="msg-title" id="msg2-title"></div>
                <div class="heart-icon">💕</div>
                <div class="msg-body" id="msg2-body"></div>
                <button class="submit-btn" onclick="goToCalendar()">NEXT ✨</button>
            </div>
        </div>

        <!-- PAGE 3 -->
        <div class="page page-3">
            <div class="calendar-card">
                <div class="calendar-title">Birthday? 🎂</div>
                <div class="date-inputs">
                    <div>
                        <input type="number" class="date-input" id="day" placeholder="DD" min="1" max="31">
                        <div class="date-label">Day</div>
                    </div>
                    <div>
                        <input type="number" class="date-input" id="month" placeholder="MM" min="1" max="12">
                        <div class="date-label">Month</div>
                    </div>
                    <div>
                        <input type="number" class="date-input" id="year" placeholder="YYYY" min="1950" max="2024">
                        <div class="date-label">Year</div>
                    </div>
                </div>
                <button class="submit-btn" onclick="calculateCountdown()">CALCULATE 💫</button>

                <div class="countdown-display" id="countdown">
                    <div class="countdown-grid" id="countdown-grid"></div>
                    <div class="quote-section">
                        <div class="funny-quote" id="quote"></div>
                        <div class="waiting-msg">✨ We wait for princess birthday ✨</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedOption = '';

        function playMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.querySelector('.music-btn-style');

            music.currentTime = 13;
            music.volume = 0.3;
            music.play().then(() => {
                btn.textContent = '🔊 STOP';
                btn.onclick = new Function("pauseMusic()");
            }).catch(e => {
                alert('Enable audio! 🎵');
            });
        }

        function pauseMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.querySelector('.music-btn-style');

            music.pause();
            btn.textContent = '🎵 PLAY';
            btn.onclick = new Function("playMusic()");
        }

        function createHearts(container) {
            const positions = [
                { top: '10%', left: '10%' },
                { top: '20%', right: '15%' },
                { top: '50%', left: '5%' },
                { top: '60%', right: '10%' }
            ];

            positions.forEach((pos, i) => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = '💕';
                heart.style.top = pos.top || 'auto';
                heart.style.left = pos.left || 'auto';
                heart.style.right = pos.right || 'auto';
                heart.style.animationDelay = (i * 0.5) + 's';
            });
        }

        function typeWrite(el, txt, speed = 40) {
            return new Promise((resolve) => {
                el.textContent = '';
                let i = 0;
                function type() {
                    if (i < txt.length) {
                        el.textContent += txt.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        async function selectOption(option) {
            if (option === 'nothing') {
                alert('Come on! Pick one! 😄');
                return;
            }

            selectedOption = option;
            document.querySelectorAll('.option-btn').forEach(btn => btn.style.background = '');
            event.target.style.background = 'linear-gradient(135deg, #FF006E 0%, #FF3B7F 100%)';
            event.target.style.color = 'white';

            setTimeout(() => goToPage2(), 600);
        }

        async function goToPage2() {
            const pages = document.querySelectorAll('.page');
            pages[0].classList.remove('active');
            pages[1].classList.add('active');

            const titles = {
                'bava': 'Surprise from your BAVA 💕',
                'love': 'Surprise from your LOVE 💕',
                'more': 'Surprise from your SOULMATE 💕'
            };

            await typeWrite(document.getElementById('msg2-title'), titles[selectedOption], 50);
            await new Promise(r => setTimeout(r, 300));

            const message = "ni santosham lo nenu gurthuku rakapovachu kani niku badha vachinapudu, lonely feel inapudu illa nenu unna ani marchipomaka i am always for you MAA 💕";
            await typeWrite(document.getElementById('msg2-body'), message, 30);
        }

        function goToCalendar() {
            const pages = document.querySelectorAll('.page');
            pages[1].classList.remove('active');
            pages[2].classList.add('active');
        }

        function calculateCountdown() {
            const day = parseInt(document.getElementById('day').value);
            const month = parseInt(document.getElementById('month').value);
            const year = parseInt(document.getElementById('year').value);

            if (!day || !month || !year) {
                alert('Fill all! 📅');
                return;
            }

            const targetDate = new Date(year, month - 1, day, 0, 0, 0).getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff < 0) {
                alert('Future date! 🎂');
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const grid = document.getElementById('countdown-grid');
            grid.innerHTML = `
                <div class="countdown-box"><div class="countdown-num">${days}</div><div class="countdown-label">DAYS</div></div>
                <div class="countdown-box"><div class="countdown-num">${hours}</div><div class="countdown-label">HRS</div></div>
                <div class="countdown-box"><div class="countdown-num">${minutes}</div><div class="countdown-label">MINS</div></div>
                <div class="countdown-box"><div class="countdown-num">${seconds}</div><div class="countdown-label">SECS</div></div>
            `;

            const quotes = [
                '🎂 Countdown to the best day! 💕',
                '✨ Magic coming soon! 🎉',
                '💫 Days to celebrate YOU! 👑'
            ];

            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            typeWrite(document.getElementById('quote'), quote, 35);

            document.getElementById('countdown').classList.add('show');

            setInterval(() => {
                const now2 = new Date().getTime();
                const diff2 = targetDate - now2;
                const d = Math.floor(diff2 / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff2 % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff2 % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff2 % (1000 * 60)) / 1000);

                const boxes = document.querySelectorAll('.countdown-num');
                if (boxes[0]) boxes[0].textContent = d;
                if (boxes[1]) boxes[1].textContent = h;
                if (boxes[2]) boxes[2].textContent = m;
                if (boxes[3]) boxes[3].textContent = s;
            }, 1000);
        }

        typeWrite(document.getElementById('msg1'), 'a small surprise from your... who am i?', 40);
    </script>
</body>
</html>
